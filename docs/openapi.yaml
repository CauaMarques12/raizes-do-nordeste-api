openapi: 3.0.3
info:
  title: Raizes do Nordeste API
  version: 1.0.0
  description: API REST para o trabalho de Back-end da rede Raizes do Nordeste. O contrato cobre autenticacao, usuarios, unidades, cardapio, produtos, estoque, pedidos multicanal, pagamento mock, fidelidade e promocoes.
servers:
  - url: http://localhost:8080
    description: Ambiente local
tags:
  - name: Auth
  - name: Usuarios
  - name: Unidades
  - name: Produtos
  - name: Estoque
  - name: Pedidos
  - name: Pagamentos
  - name: Fidelidade
  - name: Promocoes
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica usuario e retorna token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
            example:
              email: cliente@exemplo.com
              password: Senha@123
      responses:
        "200":
          description: Login realizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /usuarios:
    post:
      tags: [Usuarios]
      summary: Cadastra usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
            example:
              email: cliente@exemplo.com
              password: Senha@123
              name: Maria Cliente
              role: CLIENTE
              fidelidadeConsentida: true
      responses:
        "201":
          description: Usuario criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Usuarios]
      summary: Busca usuario por email
      description: Requer perfil ADMIN ou GERENTE.
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /usuarios/me:
    get:
      tags: [Usuarios]
      summary: Retorna o usuario logado
      responses:
        "200":
          description: Perfil do usuario logado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /usuarios/me/consentimentos/fidelidade:
    patch:
      tags: [Usuarios, Fidelidade]
      summary: Atualiza consentimento LGPD para fidelidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FidelityConsentRequest"
            example:
              fidelidadeConsentida: true
      responses:
        "200":
          description: Consentimento atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /usuarios/{userId}:
    get:
      tags: [Usuarios]
      summary: Busca usuario por id
      description: Requer perfil ADMIN ou GERENTE.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Usuarios]
      summary: Atualiza usuario
      description: Requer perfil ADMIN ou GERENTE.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
            example:
              name: Maria Atualizada
              fidelidadeConsentida: true
      responses:
        "200":
          description: Usuario atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Usuarios]
      summary: Desativa usuario
      description: Requer perfil ADMIN. A exclusao e logica.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Usuario desativado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /unidades:
    post:
      tags: [Unidades]
      summary: Cadastra unidade
      description: Requer perfil ADMIN ou GERENTE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitRequest"
            example:
              name: Unidade Recife
              address: Rua do Teste 123
              city: Recife
              state: PE
      responses:
        "201":
          description: Unidade criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Unidades]
      summary: Lista unidades
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista de unidades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnitResponse"

  /unidades/{unitId}:
    get:
      tags: [Unidades]
      summary: Busca unidade por id
      parameters:
        - $ref: "#/components/parameters/UnitId"
      responses:
        "200":
          description: Unidade encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Unidades]
      summary: Atualiza unidade
      description: Requer perfil ADMIN ou GERENTE.
      parameters:
        - $ref: "#/components/parameters/UnitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitUpdateRequest"
            example:
              city: Olinda
      responses:
        "200":
          description: Unidade atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /unidades/{unitId}/cardapio:
    get:
      tags: [Unidades, Produtos]
      summary: Consulta cardapio por unidade
      description: Lista produtos com quantidade em estoque e disponibilidade naquela unidade.
      parameters:
        - $ref: "#/components/parameters/UnitId"
        - name: category
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cardapio da unidade
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItemResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /produtos:
    post:
      tags: [Produtos]
      summary: Cadastra produto
      description: Requer perfil ADMIN ou GERENTE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
            example:
              name: Cuscuz
              description: Cuscuz nordestino com manteiga
              category: comida
              priceCents: 1500
      responses:
        "201":
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Produtos]
      summary: Lista produtos
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"

  /produtos/{productId}:
    get:
      tags: [Produtos]
      summary: Busca produto por id
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Produtos]
      summary: Atualiza produto
      description: Requer perfil ADMIN ou GERENTE.
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"
            example:
              priceCents: 1800
      responses:
        "200":
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /estoque:
    get:
      tags: [Estoque]
      summary: Consulta saldo de estoque por unidade e produto
      description: Requer perfil ADMIN, GERENTE ou ATENDENTE.
      parameters:
        - name: unidadeId
          in: query
          required: true
          schema:
            type: string
        - name: produtoId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saldo encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockBalanceResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /estoque/movimentacoes:
    post:
      tags: [Estoque]
      summary: Registra entrada ou saida de estoque
      description: Requer perfil ADMIN ou GERENTE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockMovementRequest"
            example:
              unidadeId: 64b000000000000000000001
              produtoId: 64b000000000000000000002
              tipo: ENTRADA
              quantidade: 10
              motivo: entrada inicial
      responses:
        "201":
          description: Movimento registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /pedidos:
    post:
      tags: [Pedidos]
      summary: Cria pedido validando estoque e promocao
      description: Requer perfil ADMIN, GERENTE, ATENDENTE ou CLIENTE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
            example:
              canalPedido: APP
              clienteId: 64b000000000000000000001
              unidadeId: 64b000000000000000000002
              formaPagamento: MOCK
              codigoPromocao: PROMO10
              itens:
                - produtoId: 64b000000000000000000003
                  quantidade: 2
      responses:
        "201":
          description: Pedido criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Pedidos]
      summary: Lista pedidos com filtros
      description: Requer perfil ADMIN, GERENTE, ATENDENTE ou COZINHA.
      parameters:
        - name: canalPedido
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderChannel"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /pedidos/{orderId}:
    get:
      tags: [Pedidos]
      summary: Busca pedido por id
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /pedidos/{orderId}/status:
    patch:
      tags: [Pedidos]
      summary: Atualiza status do pedido
      description: Requer perfil ADMIN, GERENTE, ATENDENTE ou COZINHA.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusRequest"
            example:
              status: EM_PREPARO
      responses:
        "200":
          description: Pedido atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "409":
          $ref: "#/components/responses/Conflict"

  /pedidos/{orderId}/cancelamento:
    patch:
      tags: [Pedidos]
      summary: Cancela pedido
      description: Cancela pedido e devolve estoque quando o pedido ainda nao foi entregue.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Pedido cancelado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "409":
          $ref: "#/components/responses/Conflict"

  /pagamentos:
    post:
      tags: [Pagamentos]
      summary: Processa pagamento mock
      description: Pagamento aprovado muda pedido para PAGO. Pagamento recusado cancela pedido e devolve estoque.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
            example:
              pedidoId: 64b000000000000000000010
              valorCents: 3000
              aprovado: true
      responses:
        "201":
          description: Pagamento registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Pagamentos]
      summary: Lista pagamentos por pedido
      parameters:
        - name: pedidoId
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista de pagamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentResponse"

  /pagamentos/{paymentId}:
    get:
      tags: [Pagamentos]
      summary: Busca pagamento por id
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pagamento encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /fidelidade/saldo:
    get:
      tags: [Fidelidade]
      summary: Consulta saldo de pontos
      parameters:
        - name: clienteId
          in: query
          required: false
          schema:
            type: string
          description: ADMIN e GERENTE podem consultar outro cliente. CLIENTE consulta o proprio saldo.
      responses:
        "200":
          description: Saldo de fidelidade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyBalanceResponse"

  /fidelidade/historico:
    get:
      tags: [Fidelidade]
      summary: Consulta historico de pontos
      parameters:
        - name: clienteId
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Historico de fidelidade
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoyaltyMovementResponse"

  /fidelidade/resgates:
    post:
      tags: [Fidelidade]
      summary: Resgata pontos de fidelidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoyaltyRedeemRequest"
            example:
              pontos: 1
      responses:
        "201":
          description: Pontos resgatados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyMovementResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /promocoes:
    post:
      tags: [Promocoes]
      summary: Cadastra promocao
      description: Requer perfil ADMIN ou GERENTE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionRequest"
            example:
              name: Campanha de abertura
              code: PROMO10
              discountPercent: 10
              active: true
      responses:
        "201":
          description: Promocao criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Promocoes]
      summary: Lista promocoes
      parameters:
        - name: active
          in: query
          required: false
          schema:
            type: boolean
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista de promocoes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromotionResponse"

  /promocoes/{promotionId}:
    get:
      tags: [Promocoes]
      summary: Busca promocao por id
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Promocao encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Promocoes]
      summary: Atualiza promocao
      description: Requer perfil ADMIN ou GERENTE.
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionUpdateRequest"
            example:
              active: false
      responses:
        "200":
          description: Promocao atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        example: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        example: 10
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    UnitId:
      name: unitId
      in: path
      required: true
      schema:
        type: string
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Requisicao invalida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestError"
    Unauthorized:
      description: Token ausente ou invalido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestError"
    Forbidden:
      description: Perfil sem permissao
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestError"
    NotFound:
      description: Recurso nao encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestError"
    Conflict:
      description: Conflito ou regra de negocio
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestError"
  schemas:
    RestError:
      type: object
      properties:
        message:
          type: string
          example: Estoque insuficiente
        error:
          type: string
          example: conflict
        code:
          type: integer
          example: 409
        causes:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 3600
        user:
          $ref: "#/components/schemas/UserResponse"

    Role:
      type: string
      enum: [CLIENTE, ATENDENTE, COZINHA, GERENTE, ADMIN]
    UserCreateRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string
          minLength: 4
          maxLength: 100
        role:
          $ref: "#/components/schemas/Role"
        fidelidadeConsentida:
          type: boolean
    UserUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string
          minLength: 4
          maxLength: 100
        role:
          $ref: "#/components/schemas/Role"
        fidelidadeConsentida:
          type: boolean
    FidelityConsentRequest:
      type: object
      required: [fidelidadeConsentida]
      properties:
        fidelidadeConsentida:
          type: boolean
    UserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        fidelidadeConsentida:
          type: boolean
